- pipeline: cd
  name: CD
  refs:
    - :default
  events:
    - type: PUSH
  fail_on_prepare_env_warning: true
  variables:
    - key: GH_TOKEN
      value: $GH_TOKEN_PRIVATE_PACKAGES
      type: VAR
  actions:
    - action: Install Dependencies
      type: BUILD
      docker_image_name: node
      docker_image_tag: 20.10.0-bookworm
      execute_commands:
        - '# Adding SSH key into the agent'
        - eval "$(ssh-agent -s)"
        - ssh-add ~/.ssh/smartcar_ci_travis_04_15_2021
        - ssh-keyscan github.com >> /root/.ssh/known_hosts
        - ''
        - '# node install'
        - npm ci
      shell: BASH
    - action: Release
      type: BUILD
      docker_image_name: node
      docker_image_tag: 20.10.0-bookworm
      execute_commands:
        - npx semantic-release
      shell: BASH
