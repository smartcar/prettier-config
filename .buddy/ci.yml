- pipeline: ci
  name: CI
  refs:
    - refs/heads/*
  events:
    - type: PUSH
  fail_on_prepare_env_warning: true
  actions:
    - action: Install Dependencies
      type: BUILD
      docker_image_name: node
      docker_image_tag: 20.10.0-bookworm
      execute_commands:
        - npm ci --ignore-scripts
        - env -i PATH=$PATH GH_TOKEN='' npm rebuild
      shell: BASH
    - action: Test
      type: BUILD
      docker_image_name: node
      docker_image_tag: 20.10.0-bookworm
      execute_commands:
        - npx prettier --check .
        - npx sort-package-json --check
        - echo 'HELLLO TEST'
      shell: BASH
